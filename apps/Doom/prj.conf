#
# Common config for the PiZZa sdl2-doom port. Per-board overrides
# (display, USB, audio) live in boards/<board>.conf.

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_LOG_PRINTK=n

# picolibc errno needs TLS -- same hard-won stanza as the wipeout and
# SDLPoP ports; without it the first failing stdio call scribbles
# through a wild TPIDRRO_EL0 offset.
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
CONFIG_THREAD_LOCAL_STORAGE=y

# Doom mallocs its zone heap (Z_Init), the 320x200 texture/backbuffers
# and sound-chunk cache. 24 MiB covers the classic zone plus headroom
# on both the 512 MiB board and qemu.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=25165824

# The game runs on the Zephyr main thread; the renderer and menu call
# chains run deep.
CONFIG_MAIN_STACK_SIZE=65536

CONFIG_FPU=y
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
