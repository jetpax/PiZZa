#
# Raspberry Pi Zero 2 W (BCM2710, Cortex-A53, AArch64) -- sdl2-doom.
# Single-core (Doom is single-threaded DOS logic; no SMP). Console +
# logs on the mini-UART, interactive `doom` shell on USB CDC ACM, HDMI
# via the VC firmware framebuffer with HVS 320x200 scaling, SFX over MAI.

CONFIG_BOOT_DELAY=200

# VC mailbox + firmware (framebuffer alloc chain).
CONFIG_RASPBERRYPI_FIRMWARE=y

# HDMI display via VC firmware FB, ARGB_8888. The shim paints Doom's
# native 320x200 frame into the virtual FB; HVS scales to the monitor.
CONFIG_DISPLAY=y
CONFIG_BCM2835_FB=y

# BCM2835 DMA -- FB driver claims a channel for the backbuffer blit;
# the HDMI audio backend claims a second (cyclic, DREQ 17 -> MAI).
CONFIG_DMA=y
CONFIG_DMA_BCM2835=y

# HDMI audio via VC4 MAI: the mixer's 44.1 kHz output is resampled to
# 48 kHz, IEC958-packed and DMA-fed into the MAI FIFO on the HDMI output
# the firmware already drives. 8-block ring needs 8 control blocks.
# Requires hdmi_drive=2 in config.txt and a display that accepts audio.
CONFIG_SDL2SHIM_AUDIO_HDMI=y
CONFIG_DMA_BCM2835_MAX_CBS_PER_CHANNEL=8

# USB CDC ACM shell, same shape as PizzaShell/wipeout. The `doom`
# command set (inject keys, audio diagnostics) registers here.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DWC2=y
CONFIG_UDC_DWC2_DMA=n
CONFIG_SERIAL=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SAMPLE_USBD_PRODUCT="PiZZa Doom -- rpi_zero_2w"
CONFIG_SAMPLE_USBD_MANUFACTURER="jetpax/PiZZa"
CONFIG_SAMPLE_USBD_PID=0xCAFE
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_LOG_BACKEND=n

# Logging on the board console (mini-UART), off the shell prompt.
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_INF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
