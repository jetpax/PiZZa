#
# qemu_cortex_a53 -- SIM target for the work-order's sim-verified gates.
# No display hardware: frames leave the guest as PPM files via
# semihosting (doom_present_semihost.c). qemu gets the semihosting flags
# from cmake/emu/qemu.cmake when CONFIG_SEMIHOST.

# Run the emulated CPU at wall speed; -icount stretches this
# software-rendered workload badly. Doom's own timing keeps pace.
CONFIG_QEMU_ICOUNT=n

CONFIG_SEMIHOST=y
CONFIG_DOOM_PRESENT_SEMIHOST=y
CONFIG_DOOM_CAPTURE_EVERY=35

# SIM_TUNING (-warp 1 1) needs an IWAD with E1M1; enable once doom1.wad
# is baked (miniwad has no maps).
# CONFIG_DOOM_SIM_TUNING=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_SDL2SHIM_LOG_LEVEL_DBG=y
