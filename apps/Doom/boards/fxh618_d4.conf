#
# FX-H618-D4 TV box (Allwinner H618, Cortex-A53 x4, AArch64) -- sdl2-doom.
# HDMI through the DE33 -> TCON-TV0 -> DW-HDMI pipeline at a fixed
# 1080p60, with the driver's render surface set to Doom's native 320x200
# in the board overlay and scaled up in hardware terms by the driver.
# Console, logs and the `doom` shell all share uart0.
#
# No audio: this box has no analog output and the DW-HDMI audio path is
# not driven yet, so the shim falls back to its "none" backend and Doom
# runs silent. HDMI audio is a separate work order.

# HDMI display via the sunxi DE33 pipeline, ARGB_8888.
CONFIG_DISPLAY=y
CONFIG_DISPLAY_SUNXI_DE33=y

# Shell on the board console. The bench snippet already supplies
# CONFIG_SHELL/KERNEL_SHELL/PSCI_SHELL; these are the Doom-side extras.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_LOG_BACKEND=n

# Logging on the same UART, kept off the shell prompt.
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
