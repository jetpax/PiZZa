#
# doom.llext core build. The zephyr.bin here is a discarded dummy; these
# options give the llext TUs the same compile environment as the
# frontend image that hosts them, minus TLS (the TLS-free-core rule) and
# C++ (sdl2-doom is pure C -- no cxxrt, no COMDAT flag). See
# apps/sokoban/core/prj.conf and the M5 handover.

CONFIG_LLEXT=y
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y

CONFIG_THREAD_LOCAL_STORAGE=n

CONFIG_FPU=y

# OPL2/OPL3 FM music (M6.5): Chocolate Doom's synth folded into the shared
# mixer, same as the app build. The frontend's M6 audio bridge carries the
# mix (SFX + music) out the HDMI MAI. Off = the fork's silent music stub.
CONFIG_DOOM_MUSIC_OPL=y
