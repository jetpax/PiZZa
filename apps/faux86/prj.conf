#
# Common config for the PiZZa Faux86 port. Per-board overrides live in
# boards/<board>.conf. Faux86 is a pure 8086 INTERPRETER: no JIT, so no
# dynrec dual-map / RWX region / giant arena that the DOSBox-X port needed.

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# picolibc errno needs TLS -- same stanza as wipeout/SDLPoP/Doom/DOSBox.
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
CONFIG_THREAD_LOCAL_STORAGE=y

# C++17 + real libstdc++ (aarch64 recipe: also pass
# -DTOOLCHAIN_HAS_GLIBCXX=ON on the west line). Faux86 uses virtual
# interfaces (RTTI/typeinfo) throughout.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y

# Guest RAM (1 MiB) + VGA memory (256 KiB) + the 800x800 XRGB render
# surface (~2.5 MiB) + RAM-staged boot floppy (~1.4 MiB) + STL. 16 MiB is
# comfortable on the 128 MiB (qemu) / 512 MiB (rpi_zero_2w) targets.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16777216

CONFIG_MAIN_STACK_SIZE=131072

CONFIG_FPU=y
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
