# SPDX-License-Identifier: GPL-2.0-or-later
# qemu sim gate: PPM frame capture over semihosting. Faux86's whole
# working set is a few MiB, so the board-default 128 MiB RAM is ample
# (no sram0 overlay / -m bump needed, unlike the DOSBox-X port).
CONFIG_SEMIHOST=y
# Faux86 boots the XT BIOS + DOS quickly under TCG; capture often.
CONFIG_FAUX86_CAPTURE_EVERY=10
