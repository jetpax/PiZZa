#
# Raspberry Pi Zero 2 W (BCM2710, Cortex-A53, AArch64) -- Faux86.
# First HW light: XT BIOS POST + MS-DOS boot on the HDMI panel. Video
# goes to HDMI via the VC framebuffer, logs to the mini-UART console.
# Single core (Faux86 runs single-threaded), no USB, no audio yet.
# No dynrec/RWX config -- Faux86 is a pure interpreter.

CONFIG_BOOT_DELAY=200

# VC mailbox + firmware (framebuffer alloc chain + ARM clock bump).
CONFIG_RASPBERRYPI_FIRMWARE=y

# HDMI display via VC firmware FB, ARGB_8888, fixed 640x400 virtual mode;
# faux86_present_display.c scales each video mode into it and the HVS
# scales 640x400 to the monitor. Requires hdmi_drive=2 in config.txt.
CONFIG_DISPLAY=y
CONFIG_BCM2835_FB=y
CONFIG_DMA=y
CONFIG_DMA_BCM2835=y

# Logging on the mini-UART console.
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
