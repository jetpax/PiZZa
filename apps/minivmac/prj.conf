#
# Common config for the PiZZa Mini vMac port. Per-board overrides
# (display, USB, audio) live in boards/<board>.conf.

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_LOG_PRINTK=n

# picolibc errno needs TLS -- the same hard-won stanza as the Doom /
# wipeout / SDLPoP ports; without it the first failing stdio call
# scribbles through a wild TPIDRRO_EL0 offset.
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
CONFIG_THREAD_LOCAL_STORAGE=y

# Mac Plus = 4 MiB emulated RAM + the 128 KiB ROM + the 512x342 ARGB
# streaming texture + Mini vMac's scaling/CLUT buffers. 32 MiB covers it
# with headroom on both the 512 MiB board and qemu.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=33554432

# The emulator runs on the Zephyr main thread; PROGMAIN + the OS-glue
# call chains run deep.
CONFIG_MAIN_STACK_SIZE=65536

CONFIG_FPU=y
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
