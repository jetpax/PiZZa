# SPDX-License-Identifier: Apache-2.0
#
# Raspberry Pi Zero 2 W (BCM2710, Cortex-A53, AArch64) -- Mini vMac.
# Single-core (the 68K emulator is single-threaded; no SMP). Console + logs
# on the mini-UART, interactive `minivmac` shell (keyboard + mouse) on USB
# CDC ACM, HDMI via the VC firmware framebuffer with HVS 512x342 scaling.
# Audio is deferred (Phase 7): the Mac boots silent on the "none" backend.

CONFIG_BOOT_DELAY=200

# VC mailbox + firmware (framebuffer alloc chain).
CONFIG_RASPBERRYPI_FIRMWARE=y

# HDMI display via VC firmware FB, ARGB_8888. The shim paints the Mac's
# native 512x342 frame into the virtual FB; the HVS scales to the monitor.
CONFIG_DISPLAY=y
CONFIG_BCM2835_FB=y

# BCM2835 DMA -- the FB driver claims a channel for the backbuffer blit.
CONFIG_DMA=y
CONFIG_DMA_BCM2835=y

# Phase 6: persistent boot disk on the microSD card. The BCM SDHost driver +
# zephyr,sdmmc-disk "SD" (both from the board DTS) carry a FATFS volume; the
# disk becomes /SD:/minivmac.dsk and guest writes survive reboot.
CONFIG_MINIVMAC_DISK_FS=y

# The disk round-trip selftest is an opt-in debug aid
# (CONFIG_MINIVMAC_DISK_SELFTEST=y); it force-reseeds the disk each boot, so
# leave it off here so guest writes persist across reboots.

# SAFETY: never auto-format the card. FS_FATFS_MOUNT_MKFS defaults y, which
# would reformat (wipe) the SD on any mount failure; force it off so a failed
# mount falls back to the RAM overlay instead of destroying the user's card.
CONFIG_FS_FATFS_MOUNT_MKFS=n

# USB CDC ACM shell, same shape as the Doom / wipeout ports. The `minivmac`
# command set (inject keyboard + mouse events) registers here.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DWC2=y
CONFIG_UDC_DWC2_DMA=n
CONFIG_SERIAL=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SAMPLE_USBD_PRODUCT="PiZZa Mini vMac -- rpi_zero_2w"
CONFIG_SAMPLE_USBD_MANUFACTURER="jetpax/PiZZa"
CONFIG_SAMPLE_USBD_PID=0x6800
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_LOG_BACKEND=n

# Logging on the board console (mini-UART), off the shell prompt.
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_INF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# ── Bluetooth HID input (M4.5: 8BitDo pad keys + BT mouse into the Mac) ──
# Stack, host profile and connection policy all live in apps/lib/btinput;
# config mirrors the HW-proven BtK1 harness (apps/BtK1/prj.conf). No
# keymap remap here: BT keyboard usages ARE SDL scancodes, so pad keys
# type letters into the Finder; the mouse drives the Mac cursor via the
# seam's absolute position (bounds 512x342 in minivmac_btinput.c).
CONFIG_BTINPUT=y
CONFIG_BTINPUT_HOGP=y
CONFIG_BTINPUT_SEAM_SDL=y
CONFIG_BTINPUT_MANAGER=y

CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_DEVICE_NAME="PiZZa"
CONFIG_BT_MAX_PAIRED=8
CONFIG_BT_MAX_CONN=3
# The 8BitDo's fw is legacy-only SMP; Just Works is the accepted trust model.
CONFIG_BT_SMP_SC_PAIR_ONLY=n
# The 4.2 controller has 1M PHY only; skip the doomed LE Set PHY attempt.
CONFIG_BT_AUTO_PHY_UPDATE=n

# Infineon AIROC patchram: this unit is the Synaptics 43436S module
# (BT ROM = 43430A1). Blob is gitignored; PROVENANCE.md has the fetch.
CONFIG_BT_AIROC=y
CONFIG_BT_AIROC_CUSTOM=y
CONFIG_AIROC_CUSTOM_FIRMWARE_HCD_BLOB="../lib/btinput/firmware/SYN43430A1.hcd"

# Bond persistence: settings FILE backend on the SD FAT. The app's disk-fs
# mounts /SD: first (minivmac_btinput.c ordering); the manager tolerates
# the already-mounted volume. MKFS stays off (see above).
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/SD:/bt/settings"
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_SDMMC_SUBSYS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FILE_SYSTEM_MKFS=n

# aarch64: BT stack defaults are Cortex-M sized; P-256 on the long WQ
# needs 8K frames (instruction-abort class otherwise).
CONFIG_BT_LONG_WQ_STACK_SIZE=8192
CONFIG_BT_RX_STACK_SIZE=8192
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_THREAD_NAME=y

# ELM FatFs is NOT thread-safe by default, and this image has two FatFs
# users on different threads: the emulator reading minivmac.dsk (main)
# and the BT bond store (btinput manager thread + system workqueue).
# Without the per-volume mutex the colliding calls share the FATFS
# sector window -- settings_load saw spurious FR_NO_FILE and bond saves
# were silently lost (HW 2026-07-08: bonds never persisted a reboot).
# REENTRANT requires the LFN buffer off BSS (stack mode).
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y

# A re-pairing peer whose new identity info (IRK) resolves an EXISTING bond
# entry is otherwise REFUSED by smp.c ("the old bond must be unpaired
# first") -- observed with the MX Master after bond litter accumulated
# under its rotating addresses (HW 2026-07-08): every reconnect became a
# pairing attempt that conflicted with a stale bond, mouse unreachable.
# With this, the stack unpairs the conflicting stale bond (trust-checked)
# and the pairing completes -- self-healing, no card surgery.
CONFIG_BT_ID_UNPAIR_MATCHING_BONDS=y
# ...and the trust check's final branch refuses JW-over-JW overwrites
# without this (smp.c update_keys_check: "old bond has more trust").
# JW has no MITM protection anyway -- the WO-accepted trust model.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
