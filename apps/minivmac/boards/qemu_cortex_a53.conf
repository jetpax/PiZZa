#
# qemu_cortex_a53 -- SIM target. Phase 1: semihost PPM capture to visually
# confirm the Mac boot screen (happy Mac -> disk-request icon) renders at
# 512x342 with correct black-on-white polarity. qemu gets the semihosting
# flags from cmake/emu/qemu.cmake when CONFIG_SEMIHOST.

# Run the emulated CPU at wall speed; -icount stretches the 68K interpreter.
CONFIG_QEMU_ICOUNT=n

CONFIG_SEMIHOST=y
CONFIG_MINIVMAC_PRESENT_SEMIHOST=y
CONFIG_MINIVMAC_CAPTURE_EVERY=60

# Drive the booted Finder with a scripted mouse + keyboard timeline.
CONFIG_MINIVMAC_SCRIPTED_INPUT=y

# Phase 6 sim gate: exercise the FS-backed disk path (mount + seed + fs
# read/write + boot-to-Finder) on a RAM-backed FAT volume standing in for the
# SD card. Auto-format the blank ramdisk -- qemu ONLY; never enabled on HW.
CONFIG_MINIVMAC_DISK_FS=y
CONFIG_MINIVMAC_FS_MOUNT="/RAM:"
CONFIG_DISK_DRIVER_RAM=y
CONFIG_FS_FATFS_MOUNT_MKFS=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_SDL2SHIM_LOG_LEVEL_DBG=y
