#
# sokoban.llext core build. The zephyr.bin here is a discarded dummy;
# these options exist to give the llext TUs the same compile
# environment as the frontend image that will host them (TLS errno,
# FPU, C++17 per the aarch64 recipe -- needs -DTOOLCHAIN_HAS_GLIBCXX=ON
# on the west line).

CONFIG_LLEXT=y
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y

# NO TLS in core builds: with TLS on, picolibc's errno and Zephyr's
# k_current_get() become TLS-variable IMPORTS (errno, z_tls_current)
# that runtime llext symbol lookup cannot resolve (the Arduino EDK
# solves that at build time with generated tls-syms; we simply avoid
# it). TLS off makes errno the exportable __errno() function.
CONFIG_THREAD_LOCAL_STORAGE=n

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y

CONFIG_FPU=y
