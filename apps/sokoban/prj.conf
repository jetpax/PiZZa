#
# Common config for the PiZZa sokoban port. Per-board overrides
# (display, USB, semihost capture) live in boards/<board>.conf.

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# Keep printk() synchronous so boot-time logging lands on the console
# even when the render loop is busy (Jet/wipeout pattern).
CONFIG_LOG_PRINTK=n

# picolibc's errno needs TLS -- same hard-won stanza as the wipeout /
# SDLPoP ports.
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
CONFIG_THREAD_LOCAL_STORAGE=y

# C++ game sources: the proven aarch64 recipe (real libstdc++ from the
# SDK; needs -DTOOLCHAIN_HAS_GLIBCXX=ON on the west line). No
# exceptions/RTTI -- the game uses neither.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y

# Heap: the renderer's 640x480 ARGB backing (1.2 MB), the per-level
# map texture (level maps up to ~720x468 -> ~1.4 MB), tileset texture
# + text surfaces, and the ~2.3 MB Game object (new'd). 8 MiB is
# generous headroom.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8388608

# The game runs on the Zephyr main thread.
CONFIG_MAIN_STACK_SIZE=65536

CONFIG_FPU=y
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y

# Audio: sokoban makes no SDL audio / Mix_* calls at all; the shim's
# AUDIO_NONE backend (Kconfig default) is the correct choice on every
# board -- do not wire the HDMI backend "for symmetry".
