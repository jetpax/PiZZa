#
# qemu_cortex_a53 -- the SIM target. No display hardware: frames leave
# the guest as PPM files via semihosting (sok_present_semihost.c); the
# scripted timeline drives title -> level 1 -> UP/LEFT/LEFT.

# Run the emulated CPU at wall speed (same rationale as SDLPoP: the
# default -icount stretches software rendering ~40x in wall-clock).
CONFIG_QEMU_ICOUNT=n

CONFIG_SEMIHOST=y
CONFIG_SOKOBAN_PRESENT_SEMIHOST=y
CONFIG_SOKOBAN_CAPTURE_EVERY=40
CONFIG_SOKOBAN_SCRIPTED_INPUT=y

# Synchronous shim logging on the emulated console.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_SOKOBAN_LOG_LEVEL_DBG=y
