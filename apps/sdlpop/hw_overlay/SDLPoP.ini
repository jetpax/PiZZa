;
; Config overlay packed into the hardware image, guarded by
; CONFIG_SDLPOP_SKIP_INFO_SCREEN. One setting only: suppress the
; SDLPoP-added "SDLPoP <version> ... Press any key to continue"
; info screen (seg000.c show_splash), so boot goes straight to the
; game's ORIGINAL Broderbund/title intro and its theme music.
;
; This port has no user-editable SDLPoP.ini and no keyboard at boot,
; so that screen only blocks the original intro. Every other option
; stays at the game's stock default (music on, fades on, ...).
[General]
enable_info_screen = false
