;
; Sim-only tuning ini, packed into the qemu build ONLY (guarded by
; CONFIG_SDLPOP_SIM_TUNING). It makes the game reach in-level
; gameplay quickly under qemu's slow software-render TCG by removing
; the fade wait loops; the hardware build ships no ini and runs the
; game with its stock defaults (fades on).
[General]
enable_fade = false
enable_music = false
enable_copyprot = false
start_fullscreen = false
