#
# PiZZa -- common config shared by every Pi Zero board. Per-board feature
# sets (USB CDC shell, HDMI, microSD, Wi-Fi, sensors) live in
# boards/<board>.conf and are auto-merged by the build.

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# Interactive shell + the `pizza` command set.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y

# Cold reset from the shell: `kernel reboot cold`. Zephyr dispatches
# sys_reboot() per platform -- PSCI on arm64 with PM_CPU_OPS_PSCI, the PM
# watchdog on both Pi SoCs -- so one command covers every board here. On
# the STB it is also the only software route back to FEL, since the app
# does not build with the `bench` snippet and so has no `psci` command.
# The delay lets the shell push the command echo before the reset cuts
# the UART off.
CONFIG_REBOOT=y
CONFIG_KERNEL_SHELL_REBOOT_DELAY=50

# Line-editing niceties.
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
