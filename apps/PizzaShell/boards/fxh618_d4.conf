#
# Transpeed FX-H618-D4 set-top box (Allwinner H618, Cortex-A53 quad,
# AArch64). Console and interactive shell share uart0 -- the box has no
# USB device port wired out, so there is no CDC ACM split to make.
#
# Built against the `orange` Zephyr worktree, which is where the
# fxh618_d4 board and the DE33/TCON-TV/DW-HDMI display driver live.

CONFIG_BOOT_DELAY=200

# Shell tuning (common SHELL_* live in prj.conf).
CONFIG_SHELL_STACK_SIZE=8192
# Shell log backend OFF so the prompt stays clean; logs go to the UART
# backend only. Must be explicit =n (Kconfig defaults it on).
CONFIG_SHELL_LOG_BACKEND=n

CONFIG_DATE_SHELL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# HDMI at 1080p60 through the DE33 mixer. The board's own DTS enables
# the display and points zephyr,display at it, so this is all the app
# owes. With no render-width/render-height set the surface is the mode
# itself, which is what the boot test card wants.
CONFIG_DISPLAY=y

CONFIG_MAIN_STACK_SIZE=5200
