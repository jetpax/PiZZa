#
# Raspberry Pi Zero 2 W (BCM2710, Cortex-A53, AArch64) -- all-features
# image. Console split: boot logs + LOG_* on the mini-UART (zephyr,console);
# interactive shell on USB CDC ACM (zephyr,shell-uart, set in the overlay).
#
# Built against the upstream-clean `pizero` Zephyr branch -- the VC firmware
# mailbox interface uses the rpi_fw API (renamed from bcm2835_property/firmware).

CONFIG_BOOT_DELAY=200

# Shell tuning (common SHELL_* live in prj.conf).
CONFIG_SHELL_STACK_SIZE=8192
# Shell log backend OFF: logs go only to LOG_BACKEND_UART (mini-UART) so the
# shell prompt stays clean; high-volume log streams otherwise race the prompt
# redraw. Must be explicit =n (Kconfig defaults it on when SHELL+LOG are set).
CONFIG_SHELL_LOG_BACKEND=n

CONFIG_HWINFO_SHELL=y
CONFIG_DATE_SHELL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# Per-subsystem shell commands
CONFIG_SENSOR_SHELL=y
CONFIG_SPI_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_I2S=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y

# Logging (on the board console, not on the shell UART)
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_INF=y

# USB device stack -- CDC ACM as the shell endpoint
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DWC2=y
CONFIG_UDC_DWC2_DMA=n
CONFIG_SERIAL=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SAMPLE_USBD_PRODUCT="PiZZa -- Zephyr on rpi_zero_2w"
CONFIG_SAMPLE_USBD_MANUFACTURER="jetpax/PiZZa"
CONFIG_SAMPLE_USBD_PID=0xCAFE
# AArch64 USBD/UDC stacks: upstream defaults overflow when CDC ACM
# usbd_thread runs through the shell.
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y

# VC mailbox + firmware (USB PHY power-on, board serial, die-temp, HDMI fb)
CONFIG_RASPBERRYPI_FIRMWARE=y
CONFIG_HWINFO=y
CONFIG_SENSOR=y

# HDMI display via VideoCore-firmware framebuffer
CONFIG_DISPLAY=y
CONFIG_BCM2835_FB=y

# Storage stack on the external microSD slot (SDHost)
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_SDMMC_SUBSYS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_FSTAB_AUTOMOUNT=y
# FS_FATFS_MOUNT_MKFS defaults Y and would REFORMAT (wipe) the SD on
# any mount failure -- the minivmac Phase-6 near-miss. Force it off
# (doubly important here: fstab automounts at boot).
CONFIG_FILE_SYSTEM_MKFS=n
CONFIG_FS_FATFS_MOUNT_MKFS=n

# DMA + SPI + I2C (I2S set above)
CONFIG_DMA=y
CONFIG_SPI=y
CONFIG_I2C=y

# Networking + Wi-Fi (CYW43439 via brcmfmac over SDIO)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=y
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
# DNS responses dispatch on net_socket_service; default 1200 overflows on AArch64.
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_WIFI=y
CONFIG_WIFI_BRCMFMAC=y
CONFIG_WIFI_LOG_LEVEL_INF=y

# Entropy (BCM2835 RNG)
CONFIG_ENTROPY_GENERATOR=y

# PWM (BCM283x PWM block, GPIO 12/13 via the board overlay) + shell
# bring-up commands (`pwm cycles ...`), analogous to i2c scan / spi.
CONFIG_PWM=y
CONFIG_PWM_SHELL=y
