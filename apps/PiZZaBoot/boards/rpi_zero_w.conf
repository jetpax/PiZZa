#
# PiZZaBoot on the original Pi Zero W: VC firmware mailbox (USB PHY
# power + HDMI fb), SDHost storage for the boot FAT, USB CDC menu
# mirror. Mirrors the Zero 2 W config; the differences are noted.

CONFIG_RASPBERRYPI_FIRMWARE=y

# HDMI menu via the VideoCore framebuffer. The overlay pins a 640x480
# render size, so the buffer is 1.2 MB and fits the default 8 MiB
# KERNEL_VM_SIZE. Dropping render-width/height to take the monitor's
# native mode would need that raised -- a 1080p buffer is 8355840 bytes
# on its own and device_map() panics without the headroom.
CONFIG_DISPLAY=y
CONFIG_BCM2835_FB=y

# Boot FAT on the microSD (SDHost); fstab automount in the overlay.
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_SDMMC_SUBSYS=y
CONFIG_FS_FATFS_FSTAB_AUTOMOUNT=y
# Never reformat the boot card on a mount failure.
CONFIG_FILE_SYSTEM_MKFS=n
CONFIG_FS_FATFS_MOUNT_MKFS=n

# USB device stack -- CDC ACM menu mirror
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DWC2=y
CONFIG_UDC_DWC2_DMA=n
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SAMPLE_USBD_PRODUCT="PiZZaBoot menu"
CONFIG_SAMPLE_USBD_MANUFACTURER="jetpax/PiZZa"
CONFIG_SAMPLE_USBD_PID=0xCAFE
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_WRN=y

# Bring-up nets; strip once the Zero W menu signs off on hardware.
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
