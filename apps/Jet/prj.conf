#
# Common config for the Jet demo, shared by every Pi Zero board.
# Per-board overrides live in boards/<board>.conf.

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# Keep printk() synchronous (straight to the console UART driver),
# NOT routed through the log subsystem. With LOG_MODE_DEFERRED + a
# busy render loop at priority 0, the log-processing thread starves
# and any printk that goes via LOG_PRINTK never reaches the UART.
CONFIG_LOG_PRINTK=n

# picolibc's errno is `__thread int errno;` -- without TLS turned on
# the linker drops `.tbss.errno` into an orphan section, and any
# `errno = ...` write off-thread silently dereferences a wild offset
# off TPIDRRO_EL0. (Suppressed in PizzaShell only by heap-layout luck.)
# The link warning is:
#   warning: orphan section `.tbss.errno' ... being placed in section `.tbss.errno'
# Enabling TLS makes the warning go away AND fixes the latent crash.
# The cross-compile toolchain doesn't auto-advertise TLS; opt in:
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
CONFIG_THREAD_LOCAL_STORAGE=y

# C++17 with the GCC libstdc++ subset Zephyr ships (std::vector, etc.
# Jet uses std::vector internally). CONFIG_GLIBCXX_LIBCPP needs
# -DTOOLCHAIN_HAS_GLIBCXX=ON on the cmake command line so libstdc++
# linker wiring kicks in.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Two heaps in play here:
#   - CONFIG_HEAP_MEM_POOL_SIZE feeds k_aligned_alloc -- used for the
#     host-side framebuffer that gets blitted into the VC scanout.
#   - CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE feeds picolibc's malloc(),
#     which is what operator new (and therefore std::vector and every
#     Jet `new`) routes through. The default (16 KiB) overflows on
#     Scene construction; we want enough headroom for the full scene
#     including the rasterizer's internal vectors. 4 MiB is generous.
CONFIG_HEAP_MEM_POOL_SIZE=16777216
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=4194304

# Display stack (driver Kconfig is picked up via DT).
CONFIG_DISPLAY=y
