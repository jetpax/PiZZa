# qemu sim gates: PPM frame capture over semihosting + scripted typing.
CONFIG_SEMIHOST=y
CONFIG_DOSBOX_SCRIPTED_INPUT=y
# DOOM under TCG renders slowly; capture often to catch game frames.
CONFIG_DOSBOX_CAPTURE_EVERY=3
# 256 MiB qemu RAM (paired with the sram0 overlay); the board default
# 128 MiB is too tight for the full DOSBox-X + DOOM working set.
CONFIG_QEMU_EXTRA_FLAGS="-m 256M"
