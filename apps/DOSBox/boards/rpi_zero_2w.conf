#
# Raspberry Pi Zero 2 W (BCM2710, Cortex-A53, AArch64) -- DOSBox-X.
# First HW light: the DOOM/DOS4GW dynrec perf gate on the panel. The
# baked DOOM HDD auto-mounts and `doom -timedemo demo3` runs on boot
# (dosbox_scripted.c); video goes to HDMI, logs + the timing result to
# the mini-UART console. Single core (DOSBox CPU emulation is
# single-threaded), no USB, no audio yet (that is P2e).

CONFIG_BOOT_DELAY=200

# VC mailbox + firmware (framebuffer alloc chain).
CONFIG_RASPBERRYPI_FIRMWARE=y

# HDMI display via VC firmware FB, ARGB_8888, fixed 640x400 virtual mode;
# dosbox_present_display.c scales each DOSBox mode into it and the HVS
# scales 640x400 to the monitor. Requires hdmi_drive=2 in config.txt.
CONFIG_DISPLAY=y
CONFIG_BCM2835_FB=y
CONFIG_DMA=y
CONFIG_DMA_BCM2835=y

# HDMI audio via VC4 MAI (same backend the Doom port HW-verified): the
# DOSBox mixer's 44.1 kHz output is resampled to 48 kHz, IEC958-packed
# and DMA-fed into the MAI FIFO. FB blit + MAI feed use separate DMA
# channels; the cyclic MAI ring needs 8 control blocks. Requires
# hdmi_drive=2 and a display that accepts audio (TV, not DVI).
CONFIG_SDL2SHIM_AUDIO_HDMI=y
CONFIG_DMA_BCM2835_MAX_CBS_PER_CHANNEL=8

# Auto-run the timedemo at the DOS prompt (the perf gate).
CONFIG_DOSBOX_SCRIPTED_INPUT=y

# Zephyr's usable region on this board is 256 MiB (from 0x200000; the VC
# firmware owns the rest). 160 MiB arena holds the guest RAM + VGA mem +
# the 6.7 MiB DOOM disk RAM-staging + STL, leaving headroom for the code,
# builtins, DOOM image rodata and the separate 8.4 MiB dynrec cache.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=167772160

# Logging on the mini-UART console.
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y

# ── Bluetooth HID input (M4.5 demo: 8BitDo pad + BT mouse into DOOM) ──
# The stack, host profile and connection policy all live in
# apps/lib/btinput; config below mirrors the HW-proven BtK1 harness
# (apps/BtK1/prj.conf) minus the harness-only debug knobs.
CONFIG_BTINPUT=y
CONFIG_BTINPUT_HOGP=y
CONFIG_BTINPUT_SEAM_SDL=y
CONFIG_BTINPUT_MANAGER=y

CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_DEVICE_NAME="PiZZa"
CONFIG_BT_MAX_PAIRED=8
CONFIG_BT_MAX_CONN=3
# The 8BitDo's fw is legacy-only SMP; Just Works is the accepted trust model.
CONFIG_BT_SMP_SC_PAIR_ONLY=n
# The 4.2 controller has 1M PHY only; skip the doomed LE Set PHY attempt.
CONFIG_BT_AUTO_PHY_UPDATE=n

# Infineon AIROC patchram: this unit is the Synaptics 43436S module
# (BT ROM = 43430A1). Blob is gitignored; PROVENANCE.md has the fetch.
CONFIG_BT_AIROC=y
CONFIG_BT_AIROC_CUSTOM=y
CONFIG_AIROC_CUSTOM_FIRMWARE_HCD_BLOB="../lib/btinput/firmware/SYN43430A1.hcd"

# Bond persistence: settings FILE backend on the SD FAT (the manager
# mounts /SD: itself; MKFS off -- a failed mount degrades to RAM bonds).
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/SD:/bt/settings"
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_SDMMC_SUBSYS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FILE_SYSTEM_MKFS=n
CONFIG_FS_FATFS_MOUNT_MKFS=n

# aarch64: BT stack defaults are Cortex-M sized; P-256 on the long WQ
# needs 8K frames (instruction-abort class otherwise).
CONFIG_BT_LONG_WQ_STACK_SIZE=8192
CONFIG_BT_RX_STACK_SIZE=8192
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_THREAD_NAME=y

# ELM FatFs is NOT thread-safe by default; the bond store is written from
# the btinput manager thread + system workqueue. Any second FatFs user in
# this app would race it (that combination silently lost every bond save
# in the minivmac image, HW 2026-07-08) -- keep the per-volume mutex on.
# REENTRANT requires the LFN buffer off BSS (stack mode).
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y

# A re-pairing peer whose new identity info (IRK) resolves an EXISTING bond
# entry is otherwise REFUSED by smp.c ("the old bond must be unpaired
# first") -- observed with the MX Master after bond litter accumulated
# under its rotating addresses (HW 2026-07-08): every reconnect became a
# pairing attempt that conflicted with a stale bond, mouse unreachable.
# With this, the stack unpairs the conflicting stale bond (trust-checked)
# and the pairing completes -- self-healing, no card surgery.
CONFIG_BT_ID_UNPAIR_MATCHING_BONDS=y
# ...and the trust check's final branch refuses JW-over-JW overwrites
# without this (smp.c update_keys_check: "old bond has more trust").
# JW has no MITM protection anyway -- the WO-accepted trust model.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
