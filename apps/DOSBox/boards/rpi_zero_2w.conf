#
# Raspberry Pi Zero 2 W (BCM2710, Cortex-A53, AArch64) -- DOSBox-X.
# First HW light: the DOOM/DOS4GW dynrec perf gate on the panel. The
# baked DOOM HDD auto-mounts and `doom -timedemo demo3` runs on boot
# (dosbox_scripted.c); video goes to HDMI, logs + the timing result to
# the mini-UART console. Single core (DOSBox CPU emulation is
# single-threaded), no USB, no audio yet (that is P2e).

CONFIG_BOOT_DELAY=200

# VC mailbox + firmware (framebuffer alloc chain).
CONFIG_RASPBERRYPI_FIRMWARE=y

# HDMI display via VC firmware FB, ARGB_8888, fixed 640x400 virtual mode;
# dosbox_present_display.c scales each DOSBox mode into it and the HVS
# scales 640x400 to the monitor. Requires hdmi_drive=2 in config.txt.
CONFIG_DISPLAY=y
CONFIG_BCM2835_FB=y
CONFIG_DMA=y
CONFIG_DMA_BCM2835=y

# HDMI audio via VC4 MAI (same backend the Doom port HW-verified): the
# DOSBox mixer's 44.1 kHz output is resampled to 48 kHz, IEC958-packed
# and DMA-fed into the MAI FIFO. FB blit + MAI feed use separate DMA
# channels; the cyclic MAI ring needs 8 control blocks. Requires
# hdmi_drive=2 and a display that accepts audio (TV, not DVI).
CONFIG_SDL2SHIM_AUDIO_HDMI=y
CONFIG_DMA_BCM2835_MAX_CBS_PER_CHANNEL=8

# Auto-run the timedemo at the DOS prompt (the perf gate).
CONFIG_DOSBOX_SCRIPTED_INPUT=y

# Zephyr's usable region on this board is 256 MiB (from 0x200000; the VC
# firmware owns the rest). 160 MiB arena holds the guest RAM + VGA mem +
# the 6.7 MiB DOOM disk RAM-staging + STL, leaving headroom for the code,
# builtins, DOOM image rodata and the separate 8.4 MiB dynrec cache.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=167772160

# Logging on the mini-UART console.
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
