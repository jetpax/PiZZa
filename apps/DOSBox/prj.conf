#
# Common config for the PiZZa DOSBox-X port. Per-board overrides live in
# boards/<board>.conf.

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_LOG_PRINTK=n

# picolibc errno needs TLS -- same stanza as wipeout/SDLPoP/Doom.
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
CONFIG_THREAD_LOCAL_STORAGE=y

# C++17 + real libstdc++ (aarch64 recipe: also pass
# -DTOOLCHAIN_HAS_GLIBCXX=ON on the west line). DOSBox-X throws through
# E_Exit/reboot paths, so exceptions are on.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
# the config system (Section_prop) dynamic_casts pervasively
CONFIG_CPP_RTTI=y

# Guest RAM (memsize) + VGA memory + surfaces + the 6.7 MiB DOOM disk
# RAM-staging + STL. The dynrec code cache is a separate 8.4 MiB static
# arena (dosbox_dyncache.c), not from this pool. 128 MiB is comfortable
# on the 256 MiB (qemu overlay) / 512 MiB (rpi_zero_2w) targets.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=134217728

# DOS kernel + shell call chains run deep; normal core recursion too.
CONFIG_MAIN_STACK_SIZE=262144

CONFIG_FPU=y
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y

# dynrec dual-map: two 8.4 MiB RW/RX aliases at 64 KiB granule on top of
# the image + SoC device maps need extra translation tables (P0 recipe).
CONFIG_MAX_XLAT_TABLES=32
