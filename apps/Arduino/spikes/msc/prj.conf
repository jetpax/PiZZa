# PiZZa Phase 6b — standalone MSC spike for rpi_zero_2w.
# Exposes the microSD (SDHost disk "SD") as a USB Mass Storage volume.
# No CDC, no FATFS, no loader: MSC owns the raw disk; the host owns the
# filesystem. Logs go to the mini-UART so we can watch enumeration.

# --- USB device stack + DWC2 (PIO mode; DMA off per BCM283x bring-up) ---
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DWC2=y
CONFIG_UDC_DWC2_DMA=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
# 6c composite: CDC ACM alongside MSC. sample_usbd registers all classes.
CONFIG_USBD_CDC_ACM_CLASS=y
# AArch64 USBD/UDC stacks: upstream defaults overflow (see memory).
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096
CONFIG_SAMPLE_USBD_MANUFACTURER="jetpax/PiZZa"
CONFIG_SAMPLE_USBD_PRODUCT="PiZZa MSC spike -- rpi_zero_2w"
CONFIG_SAMPLE_USBD_PID=0xCAFE

# --- Mass Storage class: one LUN = the SD card ---
CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_MSC_LUNS_PER_INSTANCE=1

# --- SD via SDHost -> disk-access "SD" (registered by the board DTS) ---
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_SDMMC_SUBSYS=y

# --- VC mailbox/firmware: powers the USB PHY power island at boot ---
CONFIG_RASPBERRYPI_FIRMWARE=y

# --- Logs on the mini-UART (uart1 @ 115200); shell on the CDC line ---
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_USBD_LOG_LEVEL_INF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# Interactive shell over USB CDC ACM (proves bidirectional CDC + MSC
# coexist). Logs stay on the mini-UART, off the shell prompt.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_KERNEL_SHELL=y

CONFIG_MAIN_STACK_SIZE=4096
