# PiZZa Phase 6 — CDC-transfer loader spike (rpi_zero_2w).
# Receive sketch.llext over USB CDC, write it to the firmware-owned SD,
# then llext_load + run it in-process. No MSC, no SD hand-off: the
# firmware owns the card the whole time, so a sketch could still use it.

# --- USB device stack + DWC2 + CDC ACM (the upload channel; no MSC) ---
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DWC2=y
CONFIG_UDC_DWC2_DMA=n
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096
CONFIG_SAMPLE_USBD_MANUFACTURER="jetpax/PiZZa"
CONFIG_SAMPLE_USBD_PRODUCT="PiZZa CDC-loader spike"
CONFIG_SAMPLE_USBD_PID=0xCAFE

# --- SD + FATFS, firmware-owned (the received sketch lands here) ---
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_SDMMC_SUBSYS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_FSTAB_AUTOMOUNT=y
CONFIG_FILE_SYSTEM_MKFS=n
CONFIG_FS_FATFS_MOUNT_MKFS=n

# --- LLEXT: load the sketch as a relocatable extension (Phase 0 heap fix) ---
CONFIG_LLEXT=y
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y
CONFIG_LLEXT_HEAP_SIZE=1024
CONFIG_LLEXT_HEAP_MEMBLK_BLOCK_SIZE=65536
CONFIG_LLEXT_RODATA_NO_RELOC=n

# --- CDC RX via interrupt-driven UART API + ring buffer ---
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
# Needed to read the host-set CDC baud rate -> detect the 1200-bps touch.
CONFIG_UART_LINE_CTRL=y

# --- VC firmware (USB PHY power-on) ---
CONFIG_RASPBERRYPI_FIRMWARE=y

# --- Logs on the mini-UART, separate from the CDC upload channel ---
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_USBD_LOG_LEVEL_INF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# llext_load is stack-hungry; we run it from the main thread.
CONFIG_MAIN_STACK_SIZE=16384
