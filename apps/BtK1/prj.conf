# WO-BT-K1 — M2: central + Just Works bonding to the 8BitDo Micro (K mode).
#
# M0 (transport) + M1 (patchram) passed on HW 2026-07-08: SYN43430A1 launches,
# fw local name "BCM43436 37.4MHz Class 1.", ambient adverts at 115200.
# BT debug logging is now OFF: at a 115200 console it dropped ~140 lines
# between prints and drowned both the app output and most adverts.

# The Classic HID host + boot keyboard parser live in apps/lib/btinput (M4.1).
# CONFIG_BTINPUT selects the core Classic-BT pieces (BT, BT_CLASSIC, BT_CENTRAL,
# BT_SMP, BT_BONDABLE). The matching explicit lines below are kept for clarity;
# the board/policy tunables (stack sizes, MAX_CONN/PAIRED, legacy pairing, the
# SD settings backend) are this harness's concern and stay here.
CONFIG_BTINPUT=y
# LE HOGP backend (M4.3): BLE-only HID devices (MX Master 2S mouse). The
# harness's LE scan/connect/security feeds btinput_le_attach().
CONFIG_BTINPUT_HOGP=y

CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
# HOGP client (M3): CCC handles found automatically during subscribe.
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y

# BR/EDR (Classic) host: the pad's keyboard is Classic BT HID -- its BLE face
# (FF10/FF13, stable across fresh pair + reconnects, no HIDS) is the 8BitDo
# app-config channel only. The Mac's name for it ("8BitDo Micro gamepad" vs
# BLE's "80EL") comes from Classic inquiry: dual-mode device, same BD_ADDR.
# EXPERIMENTAL upstream; this controller's firmware does BR/EDR (RPiOS uses it).
CONFIG_BT_CLASSIC=y
CONFIG_BT_DEVICE_NAME="PiZZa"
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
# M4.3 multi-device: keyboard + mouse concurrently (+ headroom). MAX_PAIRED
# sizes both the LE bond table and the BR link-key pool.
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_MAX_CONN=3

# Zephyr 4.4 disables LE legacy pairing by default (BT_SMP_SC_PAIR_ONLY=y).
# The 8BitDo Micro's fw is legacy-only SMP (pairing rsp auth_req 0x01: bonding,
# no SC bit -- captured 2026-07-08), so it was rejected at smp.c:3279 with
# AUTH_REQUIREMENTS before any pairing ran. Re-enable legacy: unauthenticated
# Just Works is the WO-accepted trust model for this keypad.
CONFIG_BT_SMP_SC_PAIR_ONLY=n

# Infineon AIROC HCI extension, custom-firmware path.
CONFIG_BT_AIROC=y
CONFIG_BT_AIROC_CUSTOM=y
# Patchram: SYN43430A1 — this unit is the Synaptics 43436S module (wifi side
# runs brcmfmac43436s / "BCM43430A1 7.45.96.s1"), so the BT ROM is 43430A1
# rev. B0-on-A1 launches dead firmware (observed 2026-07-08). See
# firmware/PROVENANCE.md for the RPiOS mapping.
CONFIG_AIROC_CUSTOM_FIRMWARE_HCD_BLOB="firmware/SYN43430A1.hcd"

# Bond persistence: settings FILE backend on the SD FAT — no NVS partition
# (WO T2.2). The identity address also persists there, so the pad bonds to a
# stable identity; bonds and identity live and die together on the card.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/SD:/bt/settings"

# SD FAT storage (recipe from PizzaShell/Wipeout rpi_zero_2w.conf). MKFS
# stays OFF: a failed mount must degrade to RAM-only bonds, never reformat.
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_SDMMC_SUBSYS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FILE_SYSTEM_MKFS=n
CONFIG_FS_FATFS_MOUNT_MKFS=n

CONFIG_LOG=y
CONFIG_BT_LOG_LEVEL_INF=y
# SMP-only debug: shows the Pairing Request/Response feature bytes and the
# exact failure origin (peer vs local) without the firehose of full BT dbg.
CONFIG_BT_SMP_LOG_LEVEL_DBG=y
# (BT_L2CAP_LOG_LEVEL_DBG served its purpose 2026-07-08: the pad's inbound
# bail is a hard ~190 ms deadline that its own mid-auth attempts miss -- no
# SDP query involved; the de-correlated rescue page is the answer. Re-enable
# only for a new L2CAP-level investigation.)

# The 4.2 controller has 1M PHY only; skip the doomed LE Set PHY attempt.
CONFIG_BT_AUTO_PHY_UPDATE=n

# aarch64: the BT stack-size defaults are Cortex-M sized (long WQ 1400,
# RX 1200, HCI TX 512). LE SC pairing runs P-256 on the long workqueue and
# blew straight through it -- instruction abort via a corrupted saved lr,
# ~240 ms after set_security (observed 2026-07-08). Size for 64-bit frames;
# RAM is 256 MB, generosity is free.
CONFIG_BT_LONG_WQ_STACK_SIZE=8192
CONFIG_BT_RX_STACK_SIZE=8192
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_THREAD_NAME=y

# FATFS + settings frames run on the main thread during init; aarch64 frames
# are wide.
CONFIG_MAIN_STACK_SIZE=8192
