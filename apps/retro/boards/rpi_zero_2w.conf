# SPDX-License-Identifier: Apache-2.0
#
# Raspberry Pi Zero 2 W (BCM2710, Cortex-A53, AArch64) -- libretro
# frontend. Console + logs on the mini-UART, interactive shell
# (`retro key ...`) on USB CDC ACM, HDMI via the VC firmware
# framebuffer with HVS scaling. No audio (the 2048 core emits none;
# the audio ring lands with the first audible core).

CONFIG_BOOT_DELAY=200

# ── M2: llext-loaded core from the SD FAT ───────────────────────────
# 2048.llext lives at /SD:/cores/2048.llext (build core2048/ for THIS
# board and copy it there). 64 KiB MMU pages round every ELF region up,
# so the heap floor is N regions x 64 KiB; 4 MiB covers small cores
# with headroom. RODATA_NO_RELOC requires !MMU -- force off (the
# Arduino-loader lesson).
CONFIG_LLEXT=y
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y
CONFIG_LLEXT_IMPORT_ALL_GLOBALS=y
CONFIG_LLEXT_HEAP_SIZE=4096
CONFIG_LLEXT_RODATA_NO_RELOC=n
CONFIG_RETRO_CORE_LLEXT_FS=y

# The default kernel VM window is 8 MB (0x200000..0xA00000). The 16 MiB
# malloc arena + 4 MiB llext heap push the image's .bss/.noinit (incl.
# the llext heap the loader W^X-remaps) past that window, so
# k_mem_update_flags asserts "invalid virtual address region" mid-load.
# 64 MB covers the frontend + the biggest cores with headroom (SRAM is
# 256 MB). Same fix as the qemu board conf.
CONFIG_KERNEL_VM_SIZE=0x4000000

# VC mailbox + firmware (framebuffer alloc chain).
CONFIG_RASPBERRYPI_FIRMWARE=y

# HDMI display via VC firmware FB, ARGB_8888. The core's frame is
# centered in the 384x464 virtual FB (384*4 = 1536 B/row, 64-byte
# aligned for the FB driver's contiguous-DMA fast path); HVS scales
# to the monitor's native mode.
CONFIG_DISPLAY=y
CONFIG_BCM2835_FB=y

# BCM2835 DMA -- FB driver claims a channel for the backbuffer blit.
CONFIG_DMA=y
CONFIG_DMA_BCM2835=y

# USB CDC ACM shell, same shape as PizzaShell / wipeout / SDLPoP.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DWC2=y
CONFIG_UDC_DWC2_DMA=n
CONFIG_SERIAL=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SAMPLE_USBD_PRODUCT="PiZZa retro -- rpi_zero_2w"
CONFIG_SAMPLE_USBD_MANUFACTURER="jetpax/PiZZa"
CONFIG_SAMPLE_USBD_PID=0xCAFE
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_LOG_BACKEND=n

# Logging on the board console (mini-UART), off the shell prompt.
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_INF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# ── Bluetooth HID input (8BitDo pad -> retropad) ─────────────────────
# Stack, host profile and connection policy all live in apps/lib/btinput;
# config mirrors the HW-proven minivmac/DOSBox/sokoban bring-up. The pad
# keymap (K-mode usages -> frontend scancodes) is in retro_btinput.c.
CONFIG_BTINPUT=y
CONFIG_BTINPUT_HOGP=y
CONFIG_BTINPUT_SEAM_SDL=y
CONFIG_BTINPUT_MANAGER=y

CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_DEVICE_NAME="PiZZa"
CONFIG_BT_MAX_PAIRED=8
CONFIG_BT_MAX_CONN=3
# The 8BitDo's fw is legacy-only SMP; Just Works is the accepted trust model.
CONFIG_BT_SMP_SC_PAIR_ONLY=n
# The 4.2 controller has 1M PHY only; skip the doomed LE Set PHY attempt.
CONFIG_BT_AUTO_PHY_UPDATE=n

# Infineon AIROC patchram: this unit is the Synaptics 43436S module
# (BT ROM = 43430A1). Blob is gitignored; PROVENANCE.md has the fetch.
CONFIG_BT_AIROC=y
CONFIG_BT_AIROC_CUSTOM=y
CONFIG_AIROC_CUSTOM_FIRMWARE_HCD_BLOB="../lib/btinput/firmware/SYN43430A1.hcd"

# Bond persistence: settings FILE backend on the SD FAT (the manager
# mounts /SD:). MKFS stays off -- the card is PiZZa-imaged.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/SD:/bt/settings"
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_SDMMC_SUBSYS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FILE_SYSTEM_MKFS=n
# FS_FATFS_MOUNT_MKFS defaults Y and would REFORMAT (wipe) the SD on
# any mount failure -- the minivmac Phase-6 near-miss. Force it off.
CONFIG_FS_FATFS_MOUNT_MKFS=n

# ELM FatFs is NOT thread-safe by default; the bond store alone has two
# FatFs users (btinput manager thread + system workqueue for settings
# saves). Per-volume mutex + LFN buffer on stack.
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y

# aarch64: BT stack defaults are Cortex-M sized; P-256 on the long WQ
# needs 8K frames (instruction-abort class otherwise).
CONFIG_BT_LONG_WQ_STACK_SIZE=8192
CONFIG_BT_RX_STACK_SIZE=8192
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_THREAD_NAME=y

# Bond hygiene (HW-proven on minivmac): let a re-pairing peer whose new
# IRK resolves an existing bond replace it instead of being refused, and
# allow JW-over-JW overwrites (JW has no MITM protection anyway).
CONFIG_BT_ID_UNPAIR_MATCHING_BONDS=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
