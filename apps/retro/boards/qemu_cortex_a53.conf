#
# qemu_cortex_a53 -- the SIM target, board-common bits. No display
# hardware: frames leave the guest as PPM via semihosting
# (retro_present_semihost.c); the scripted timeline drives input.
#
# The core-source choice is NOT set here -- pick a sim scenario with an
# EXTRA_CONF_FILE fragment:
#   overlays/qemu_embed.conf  -- M2: one embedded core, unload/reload
#                                cycle test.
#   overlays/qemu_menu.conf (+ overlays/qemu_ramdisk.overlay) -- M4:
#                                launcher menu over a ram-disk seeded
#                                with two cores; core swap in sim.

# Run the emulated CPU at wall speed (fleet-standard: -icount stretches
# software rendering badly in wall-clock).
CONFIG_QEMU_ICOUNT=n

# The board defaults the kernel VM window to 8 MB; the 16 MiB malloc
# arena pushes the llext heap past it and the W^X permission pass
# asserts (mmu.h "invalid virtual address region"). 64 MB covers it.
CONFIG_KERNEL_VM_SIZE=0x4000000

CONFIG_SEMIHOST=y
CONFIG_RETRO_PRESENT_SEMIHOST=y
CONFIG_RETRO_CAPTURE_EVERY=30
CONFIG_RETRO_SCRIPTED_INPUT=y

# llext base (both scenarios load relocatable cores).
CONFIG_LLEXT=y
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y
CONFIG_LLEXT_IMPORT_ALL_GLOBALS=y
CONFIG_LLEXT_HEAP_SIZE=4096
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Synchronous shim logging on the emulated console.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_RETRO_LOG_LEVEL_DBG=y
