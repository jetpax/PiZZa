#
# qemu_cortex_a53 -- the SIM target. No display hardware: frames leave
# the guest as PPM files via semihosting (retro_present_semihost.c);
# the scripted timeline drives title -> game -> D-pad moves.

# Run the emulated CPU at wall speed (fleet-standard: -icount stretches
# software rendering badly in wall-clock).
CONFIG_QEMU_ICOUNT=n

CONFIG_SEMIHOST=y
CONFIG_RETRO_PRESENT_SEMIHOST=y
CONFIG_RETRO_CAPTURE_EVERY=30
CONFIG_RETRO_SCRIPTED_INPUT=y

# ── M2: llext-loaded core (embedded blob -- qemu has no SD) ─────────
# The .llext comes from core2048/ (west build -t core2048), named by
# the RETRO_CORE_LLEXT env at build time.
CONFIG_LLEXT=y
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y
CONFIG_LLEXT_IMPORT_ALL_GLOBALS=y
CONFIG_LLEXT_HEAP_SIZE=4096
CONFIG_RETRO_CORE_LLEXT_EMBED=y

# Cycle test: 300 frames (~5 s) per bind, then unload + reload; the
# llext heap watermark is logged each cycle and must hold a baseline.
CONFIG_RETRO_LLEXT_CYCLE_TEST=300
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Synchronous shim logging on the emulated console.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_RETRO_LOG_LEVEL_DBG=y
