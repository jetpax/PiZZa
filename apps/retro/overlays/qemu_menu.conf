#
# M4 sim scenario: the launcher menu over a ram-disk FAT seeded with
# two cores, so the fs scan + in-process swap runs in sim. Build:
#   RETRO_CORE_LLEXT=<2048.llext> RETRO_CORE_LLEXT2=<sokoban.llext> \
#   west build -b qemu_cortex_a53 -s apps/retro -- \
#     -DEXTRA_CONF_FILE=overlays/qemu_menu.conf \
#     -DEXTRA_DTC_OVERLAY_FILE=overlays/qemu_ramdisk.overlay

CONFIG_RETRO_CORE_LLEXT_FS=y
CONFIG_RETRO_MENU=y
CONFIG_RETRO_MENU_DIR="/RAM:/cores"
CONFIG_RETRO_STORAGE_MOUNT="/RAM:"
CONFIG_RETRO_MENU_WIDTH=640
CONFIG_RETRO_MENU_HEIGHT=480

# Ram-disk FAT (zephyr,ram-disk "RAM" in the overlay), formatted on
# first mount, then seeded by retro_qemu_seed.c.
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_RAM=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MOUNT_MKFS=y
CONFIG_RETRO_QEMU_RAMDISK_SEED=y

# The scripted timeline drives the menu (down -> A) + gameplay + the
# L+R return chord; larger capture stride to span the phases.
CONFIG_RETRO_CAPTURE_EVERY=45
