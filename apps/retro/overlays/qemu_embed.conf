# M2 sim scenario: one core embedded in the image (buf loader), run
# with the unload/reload cycle test. Build:
#   RETRO_CORE_LLEXT=<.llext> west build -b qemu_cortex_a53 \
#     -s apps/retro -- -DEXTRA_CONF_FILE=overlays/qemu_embed.conf

CONFIG_RETRO_CORE_LLEXT_EMBED=y
CONFIG_RETRO_LLEXT_CYCLE_TEST=300
