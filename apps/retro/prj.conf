#
# Common config for the PiZZa libretro frontend. Per-board overrides
# (display, USB, semihost capture) live in boards/<board>.conf.

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# Keep printk() synchronous so boot-time logging lands on the console
# even when the run loop is busy.
CONFIG_LOG_PRINTK=n

# picolibc's errno needs TLS -- same stanza as every shim consumer.
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
CONFIG_THREAD_LOCAL_STORAGE=y

# Heap: the 2048 core calloc's its 376x464 XRGB8888 frame_buf (~700 KB)
# plus small text scratch surfaces; the display backend mallocs one
# ARGB backbuffer at core geometry. 4 MiB is generous for this core;
# bigger cores revisit.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=4194304

# retro_run + the core execute on the Zephyr main thread.
CONFIG_MAIN_STACK_SIZE=65536

CONFIG_FPU=y
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
