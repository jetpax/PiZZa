#
# qemu_cortex_a53 -- the SIM target for the work-order's sim-verified
# gates. No display hardware: frames leave the guest as PPM files via
# semihosting (pop_present_semihost.c); qemu gets the semihosting
# flags automatically from cmake/emu/qemu.cmake when CONFIG_SEMIHOST.

# Run the emulated CPU at wall speed. The default -icount shift=4
# stretches this software-rendered, per-pixel-blit workload ~40x in
# wall-clock; the game's own k_timer pacing keeps frame timing sane
# without it, and disabling lets the sim actually reach gameplay.
CONFIG_QEMU_ICOUNT=n

CONFIG_SEMIHOST=y
CONFIG_SDLPOP_PRESENT_SEMIHOST=y
CONFIG_SDLPOP_CAPTURE_EVERY=25
CONFIG_SDLPOP_VIDEO_SELFTEST=y
CONFIG_SDLPOP_SCRIPTED_INPUT=y
CONFIG_SDLPOP_SIM_TUNING=y

# Synchronous shim logging on the emulated console.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_SDLPOP_LOG_LEVEL_DBG=y
