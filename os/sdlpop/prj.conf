#
# Common config for the PiZZa SDLPoP port. Per-board overrides
# (display, USB, SD) live in boards/<board>.conf.

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# Keep printk() synchronous so the game's boot-time logging lands on
# the console even when the render loop is busy (Jet/wipeout pattern).
CONFIG_LOG_PRINTK=n

# picolibc's errno needs TLS -- same hard-won stanza as the wipeout
# port; without it the first failing fs/stdio call scribbles through
# a wild TPIDRRO_EL0 offset.
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
CONFIG_THREAD_LOCAL_STORAGE=y

# Heap: SDLPoP mallocs every decoded sprite surface (~4 MB of PNGs
# expand to indexed surfaces), the onscreen/overlay surfaces, texture
# buffers and the odd qsort scratch. 16 MiB gives generous headroom
# on both the 512 MiB board and qemu.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16777216

# The game runs on the Zephyr main thread; init/menu call chains run
# deep.
CONFIG_MAIN_STACK_SIZE=65536

CONFIG_FPU=y
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
