#
# Raspberry Pi Zero W (BCM2835, ARM1176, ARMv6) -- console-only port.
# Shell + console share the AUX mini-UART (board DTS: zephyr,console and
# zephyr,shell-uart both -> &uart1). The interrupt-driven shell backend
# works on silicon, so no extra config is needed beyond the common prj.conf.
# Storage / display / Wi-Fi / sensor fields render as "--" since those
# subsystems are not part of this port.
