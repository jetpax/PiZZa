# SPDX-License-Identifier: Apache-2.0
#
# Raspberry Pi Zero W (BCM2835, ARM1176, ARMv6) -- USB-CDC enabled image.
# Console split: boot logs + LOG_* on the AUX mini-UART (zephyr,console);
# interactive shell on USB CDC ACM (zephyr,shell-uart, set in the overlay).
# Storage / Wi-Fi / sensor fields render as "--" pending future bring-up.

CONFIG_BOOT_DELAY=200

# Shell tuning (common SHELL_* live in prj.conf).
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_LOG_BACKEND=n

CONFIG_HWINFO_SHELL=y
CONFIG_DATE_SHELL=y
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# Logging on the board console (mini-UART), not the shell UART
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_INF=y

# USB device stack -- CDC ACM as the shell endpoint
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DWC2=y
CONFIG_UDC_DWC2_DMA=n
CONFIG_SERIAL=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_CONSOLE_SUBSYS=y
CONFIG_SAMPLE_USBD_PRODUCT="PiZZa -- Zephyr on rpi_zero_w"
CONFIG_SAMPLE_USBD_MANUFACTURER="jetpax/PiZZa"
CONFIG_SAMPLE_USBD_PID=0xCAFE
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y

# VC mailbox + firmware (needed to power on the USB PHY via SET_POWER_STATE)
CONFIG_RASPBERRYPI_FIRMWARE=y
CONFIG_HWINFO=y

CONFIG_MAIN_STACK_SIZE=4096
