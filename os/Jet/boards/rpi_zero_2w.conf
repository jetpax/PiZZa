#
# Raspberry Pi Zero 2 W (BCM2710, Cortex-A53, AArch64) -- Jet demo
# all-features image. Console + logs on the mini-UART by default; the
# USB CDC ACM shell stays available for "info" and an interactive
# break.

CONFIG_BOOT_DELAY=200

# VC mailbox + firmware (needed by bcm2835_fb for the framebuffer
# allocation chain).
CONFIG_RASPBERRYPI_FIRMWARE=y

# HDMI display via VideoCore-firmware framebuffer (RGB565 mode set in
# the overlay).
CONFIG_BCM2835_FB=y

# USB device stack -- CDC ACM as the shell endpoint, matching PizzaShell.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DWC2=y
CONFIG_UDC_DWC2_DMA=n
CONFIG_SERIAL=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SAMPLE_USBD_PRODUCT="PiZZa Jet demo -- rpi_zero_2w"
CONFIG_SAMPLE_USBD_MANUFACTURER="jetpax/PiZZa"
CONFIG_SAMPLE_USBD_PID=0xCAFE
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096

# Shell over USB CDC ACM for the `jet` command set.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_LOG_BACKEND=n

# Logging on the board console (mini-UART), out of the shell prompt's
# way.
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y

# Render loop owns the main thread; bump it to give Jet's std::vector
# allocations + scene setup room without piling on the heap path.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y

# A53 FPU -- not strictly required (Jet is integer hot path) but cheap
# to enable for the bits of scene math that do touch floats.
CONFIG_FPU=y
