#
# Raspberry Pi Zero 2 W (BCM2710, Cortex-A53, AArch64) -- WipEout demo.
# Console + logs on the mini-UART. USB CDC ACM shell for the `wipeout`
# command set (clock check, fps, frame capture). 4-core SMP enabled
# via the local Zephyr `dev` branch (smp-base..dev range -- the
# SOC_PER_CORE_INIT_HOOK gate plus the BCM2836 mailbox-0 sched-IPI
# driver). `wipeout flush parallel 4 64` runs bands 1..3 on their
# own cpus.

CONFIG_BOOT_DELAY=200

# 4-core SMP. Brings up cpu@1..3 via spin-table secondary release;
# scheduler IPI runs over the BCM2836 per-core mailbox 0. Peripheral
# and GPU interrupts stay on core 0 -- fine for the renderer because
# workers wait on semaphores from cpu 0 and do no peripheral I/O.
# Enables k_thread_cpu_pin() so gfx_parallel_zephyr.c's pin path
# actually puts bands 1..3 on cpus 1..3.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_SPINTABLE=y
# Prototype operates with FPU_SHARING off -- only SCHED_IPI uses the
# mailbox path (FPU/MMU/USR IPIs would otherwise call into GIC code
# which doesn't exist on BCM2710). Kconfig auto-selects FPU_SHARING
# when SMP+FPU are both on, so force it off explicitly.
CONFIG_FPU_SHARING=n

# VC mailbox + firmware (framebuffer alloc chain, ARM clock readback,
# die temp).
CONFIG_RASPBERRYPI_FIRMWARE=y
CONFIG_HWINFO=y
CONFIG_SENSOR=y

# HDMI display via VC firmware FB. ARGB_8888 (depth 32) so the engine's
# rgba_t buffer maps 1:1 onto a 32-bit FB word (modulo the R/B swap
# we do at present time -- see platform_zephyr.c). Pair with the
# render-width / render-height overlay for HVS 320x240 -> monitor
# scaling.
CONFIG_DISPLAY=y
CONFIG_BCM2835_FB=y

# BCM2835 DMA -- the FB driver claims a free channel at init for the
# backbuffer->fb blit. Hides the present memcpy off the CPU.
CONFIG_DMA=y
CONFIG_DMA_BCM2835=y

# Storage stack on the external microSD slot (SDHost). Wipeout assets
# (~150 MB after `wipeout-data-v01.zip` extraction) live at
# /SD:/wipeout/. CONFIG_FILE_SYSTEM_MKFS stays OFF -- a failed mount
# must not erase the user's card.
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_SDMMC_SUBSYS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_FSTAB_AUTOMOUNT=y
CONFIG_FILE_SYSTEM_MKFS=n
CONFIG_FS_FATFS_MOUNT_MKFS=n

# Multi-partition support. The PINN-imaged SD has a RECOVERY FAT at
# partition 1 (Pi firmware, dtbs, our kernel.img -- bootloader-visible
# only, no room for assets). We mount that as /SD: AND also bind a
# second FAT partition (partition 2, manually added from the ~31 GiB
# of unallocated tail on the card) as /DATA: for the wipeout/ asset
# tree. Both logical volumes share the one physical SDHost disk;
# FatFs reads the MBR to locate each partition's LBA range via the
# app-side VolToPart[] table in wipeout_glue.c.
CONFIG_FS_FATFS_MULTI_PARTITION=y
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=2
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="SD,DATA"

# USB device stack -- CDC ACM as the shell endpoint, matching the
# rest of PiZZa. Boards with USBD need the sample helper.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DWC2=y
CONFIG_UDC_DWC2_DMA=n
CONFIG_SERIAL=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SAMPLE_USBD_PRODUCT="PiZZa WipEout demo -- rpi_zero_2w"
CONFIG_SAMPLE_USBD_MANUFACTURER="jetpax/PiZZa"
CONFIG_SAMPLE_USBD_PID=0xCAFE
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096

# Interactive shell over the USB CDC line (boot logs stay on the
# mini-UART). The `wipeout` subcommand set is registered from
# platform_zephyr.c.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_LOG_BACKEND=n

# Logging on the board console (mini-UART), off the shell prompt.
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_INF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
