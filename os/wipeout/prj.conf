#
# Common config for the PiZZa WipEout demo. Per-board overrides
# (display, USB, storage, SMP) live in boards/<board>.conf.

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# Keep printk() synchronous so the engine's heavy boot-time logging
# (track scan, ship load) lands on the console even when the render
# loop is busy. Same reasoning as the Jet demo.
CONFIG_LOG_PRINTK=n

# picolibc's errno needs TLS. The cross-compile toolchain doesn't
# advertise TLS by default; opt in. Without this, errno writes off
# the main thread silently scribble through a wild TPIDRRO_EL0
# offset (the symptom is a Hard Fault on the first failing fs_open
# or fs_stat call).
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
CONFIG_THREAD_LOCAL_STORAGE=y

# Heap budgets. The engine uses its own bump allocator (mem.c) for
# assets but routes a handful of allocations through libc malloc:
# pl_mpeg's video frame buffer (skipped here -- no intro.mpeg),
# realloc() in render_software's depth buffer, qsort scratch. 1 MiB
# is plenty for the depth/zbuffer and per-flush sort scratch.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576

# Engine asset model. The bump arena lives in BSS at link time
# (mem.c MEM_HUNK_BYTES); we leave that at its upstream default but
# bump MAIN_STACK because game_init has deep call chains.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_FPU=y
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
